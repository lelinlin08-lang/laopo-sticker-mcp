[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "laopo-sticker-mcp"
version = "0.1.0"
description = "A small private sticker library MCP server for ChatGPT"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28,<1",
  "mcp[cli]==2.1.1",
  "pydantic>=2.12,<3",
  "python-dotenv>=1.0,<2",
  "uvicorn>=0.31,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.25,<2",
  "ruff>=0.9,<1",
]

[project.scripts]
laopo-sticker-mcp = "laopo_sticker_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/laopo_sticker_mcp"]

[tool.hatch.build.targets.wheel.force-include]
"src/laopo_sticker_mcp/widget.html" = "laopo_sticker_mcp/widget.html"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
